/* Apply saved theme and text size before first paint to avoid a flash. */
try {

  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  if (s === 'small' || s === 'large') document.documentElement.dataset.size = s;
} catch (e) {}
