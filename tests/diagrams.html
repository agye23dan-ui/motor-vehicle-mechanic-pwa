<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram preview</title>
<link rel="stylesheet" href="../css/app.css">
</head><body style="display:block">
<main class="wide" style="max-width:640px;margin:0 auto;padding:1rem">
<h1 style="font-size:1.4rem;margin-bottom:1rem">Diagram preview</h1>
<div id="out"></div>
</main>
<script src="../data/course.js"></script>
<script type="module">
/* Open as tests/diagrams.html (served over http). Optional ?only=name1,name2 and ?theme=dark */
import { hasDiagram, diagram } from '../js/diagrams/index.js';
var q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
var only = q.get('only') ? q.get('only').split(',') : null;
var out = document.getElementById('out');
Object.keys(MVM.course.diagrams).forEach(function (name) {
  if (only && only.indexOf(name) === -1) return;
  var wrap = document.createElement('section');
  wrap.id = 'd-' + name;
  wrap.innerHTML = '<h2 style="font-size:1rem;margin:1.5rem 0 .3rem">' + name + '  <small class="muted">(module ' + MVM.course.diagrams[name].join(', ') + ')</small></h2>';
  if (hasDiagram(name)) {
    try { wrap.appendChild(diagram(name)); } catch (e) { wrap.innerHTML += '<p style="color:#c00">ERROR: ' + e.message + '</p>'; }
  } else wrap.innerHTML += '<p class="muted">(not drawn yet)</p>';
  out.appendChild(wrap);
});
document.body.dataset.ready = '1';
</script></body></html>
